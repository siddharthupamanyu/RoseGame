<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>50 Roses → Biggest Rose (Thorns + Walls)</title>
  <style>
    :root{
      --bg:#0f1220; --fg:#e9e9f4; --panel:rgba(20,24,48,.72);
      --border:rgba(90,100,200,.35); --btn:rgba(20,24,48,.88);
    }
    html,body{
      margin:0;height:100%;background:var(--bg);color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      overscroll-behavior:none;touch-action:none;
    }
    .wrap{display:grid;place-items:center;height:100%;}
    canvas{
      background: radial-gradient(1200px 650px at 50% 30%, #1b2146, #0f1220);
      border:2px solid #2b3160;border-radius:14px;
      max-width:100vw;max-height:100vh;
    }
    .hud{
      position:fixed;top:10px;left:10px;right:10px;
      display:flex;gap:10px;align-items:center;justify-content:space-between;
      pointer-events:none; z-index:10;
    }
    .pill{
      background:var(--panel);
      border:1px solid var(--border);
      padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px);
      font-weight:800;pointer-events:none;
      display:flex;gap:10px;align-items:center;
    }
    .hint{opacity:.92;font-weight:650;display:none;}
    @media (min-width: 700px){ .hint{display:block;} }

    .controls{
      position:fixed;left:0;right:0;bottom:0;
      display:flex;justify-content:space-between;align-items:flex-end;
      padding:14px 14px 18px;
      gap:12px; z-index:20;
      pointer-events:none;
    }

    .joy{
      width:150px;height:150px;border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.10);
      position:relative;
      backdrop-filter:blur(6px);
      pointer-events:auto;
      touch-action:none;
    }
    .joy::after{
      content:"";
      position:absolute;inset:14px;border-radius:999px;
      border:1px dashed rgba(255,255,255,.18);
    }
    .knob{
      width:64px;height:64px;border-radius:999px;
      position:absolute;left:50%;top:50%;
      transform:translate(-50%,-50%);
      background:rgba(120,200,255,.22);
      border:1px solid rgba(120,200,255,.45);
      box-shadow:0 10px 25px rgba(0,0,0,.25);
    }
    .joyLabel{
      position:absolute;left:50%;top:50%;
      transform:translate(-50%,calc(-50% + 58px));
      font-size:12px;opacity:.8;user-select:none;pointer-events:none;
      white-space:nowrap;
    }

    .rightBtns{
      display:flex;flex-direction:column;gap:10px;align-items:flex-end;
      pointer-events:auto;
    }
    .btnRow{display:flex;gap:10px;align-items:center;justify-content:flex-end;}
    button{
      background:var(--btn);color:var(--fg);
      border:1px solid rgba(90,100,200,.45);
      padding:12px 14px;border-radius:12px;
      font-weight:800;cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action:manipulation;
    }
    button:active{transform:translateY(1px);filter:brightness(1.12);}
    .bigTap{
      width:120px;height:120px;border-radius:22px;
      display:grid;place-items:center;
      font-size:20px;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(180deg, rgba(255,80,140,.24), rgba(20,24,48,.88));
      box-shadow:0 18px 50px rgba(0,0,0,.35);
    }
    .smallBtn{padding:10px 12px;border-radius:12px;font-size:14px;font-weight:800;}
    .toggleOn{outline:2px solid rgba(120,200,255,.55);}

    .toast{
      position:fixed;inset:0;display:grid;place-items:center;padding:24px;
      background:rgba(0,0,0,.40);backdrop-filter:blur(6px);
      visibility:hidden;opacity:0;transition:opacity 160ms ease;
      z-index:30;
    }
    .toast.show{visibility:visible;opacity:1;}
    .card{
      max-width:520px;width:100%;
      background:rgba(20,24,48,.93);
      border:1px solid rgba(90,100,200,.50);
      border-radius:16px;padding:18px 18px 14px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    .card h2{margin:0 0 8px;}
    .card p{margin:8px 0;line-height:1.45;opacity:.95;}
    .card .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}

    .desktopTip{
      position:fixed;bottom:10px;left:10px;opacity:.85;font-size:12px;z-index:9;
    }
    @media (max-width: 699px){ .desktopTip{display:none;} }
    .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;padding:2px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);}
  </style>
</head>
<body>
  <div class="hud">
    <div class="pill" id="scorePill">Roses: 0 / 50</div>
    <div class="pill hint" id="hintPill">
      Desktop: <span class="kbd">WASD</span>/<span class="kbd">Arrows</span> • <span class="kbd">Space</span> dash • Avoid thorns • Walls = death
    </div>
  </div>

  <div class="wrap">
    <canvas id="c" width="900" height="520"></canvas>
  </div>

  <div class="desktopTip">
    Tip: Press <span class="kbd">R</span> to restart • Touch wall = death • Thorn hit = -5 roses
  </div>

  <div class="controls">
    <div class="joy" id="joy">
      <div class="knob" id="knob"></div>
      <div class="joyLabel">Move</div>
    </div>

    <div class="rightBtns">
      <div class="btnRow">
        <button class="smallBtn" id="pauseBtn" type="button">Pause</button>
        <button class="smallBtn" id="restartBtn" type="button">Restart</button>
      </div>
      <div class="btnRow">
        <button class="smallBtn" id="sfxBtn" type="button">SFX: On</button>
        <button class="smallBtn" id="musicBtn" type="button">Music: On</button>
      </div>
      <button class="bigTap" id="tapBtn" type="button">Tap<br/>Dash</button>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="card">
      <h2 id="toastTitle">Game Over</h2>
      <p id="toastBody">You touched a wall.</p>
      <div class="row">
        <button id="playAgainBtn" type="button">Play again</button>
        <button id="closeToastBtn" type="button">Close</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const scorePill = document.getElementById("scorePill");
  const hintPill = document.getElementById("hintPill");

  const restartBtn = document.getElementById("restartBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const sfxBtn = document.getElementById("sfxBtn");
  const musicBtn = document.getElementById("musicBtn");
  const tapBtn = document.getElementById("tapBtn");

  const toast = document.getElementById("toast");
  const toastTitle = document.getElementById("toastTitle");
  const toastBody = document.getElementById("toastBody");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const closeToastBtn = document.getElementById("closeToastBtn");

  const joy = document.getElementById("joy");
  const knob = document.getElementById("knob");

// ✅ iOS-safe: Prevent scroll ONLY on the canvas + joystick (not the whole window)
function blockScroll(el) {
  el.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
  el.addEventListener("touchmove",  (e) => e.preventDefault(), { passive: false });
}
blockScroll(canvas);
blockScroll(joy);

// Audio unlock on user gesture
function userGestureUnlockAudio() {
  if (!audioCtx) {
    ensureAudio();
    startRomanticMusicIfNeeded();
  } else if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

// ✅ iOS-safe button handler (use pointerdown, not click)
const onTap = (el, fn) => {
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    userGestureUnlockAudio();
    fn();
  });
};

// Buttons
onTap(restartBtn, reset);
onTap(pauseBtn, () => { paused = !paused; updateHUD(); });
onTap(tapBtn, dash);
onTap(sfxBtn, () => setSfxEnabled(!sfxEnabled));
onTap(musicBtn, () => setMusicEnabled(!musicEnabled));
onTap(playAgainBtn, reset);
onTap(closeToastBtn, () => toast.classList.remove("show"));

// Keep canvas tap-to-dash, but don't steal taps from buttons
canvas.addEventListener("pointerdown", (e) => {
  if (e.target !== canvas) return;
  userGestureUnlockAudio();
  dash();
});


  // Utilities
  const rand = (min, max) => Math.random() * (max - min) + min;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  // Game constants
  const TARGET = 50;
  const ROSE_COUNT_ON_MAP = 10;
  const ROSE_RADIUS = 14;
  const BIG_ROSE_RADIUS = 52;

  // Thorns
  const THORN_COUNT = 7;
  const THORN_R = 18;
  const THORN_DMG = 5;
  const HIT_IFRAME = 0.55; // seconds of invulnerability after thorn hit

  // Dash
  const DASH_COOLDOWN = 0.75;
  const DASH_DURATION = 0.12;
  const DASH_SPEED_MULT = 2.6;

  // --- Audio: WebAudio (Romantic pad + arpeggio)
  let audioEnabled = false;
  let sfxEnabled = true;
  let musicEnabled = true;

  let audioCtx = null;
  let master = null;
  let musicBus = null;
  let sfxBus = null;

  let musicState = {
    started: false,
    timer: null,
    step: 0,
    // C major romantic-ish progression: C  Am  F  G (I-vi-IV-V)
    progression: [
      [261.63, 329.63, 392.00], // C E G
      [220.00, 261.63, 329.63], // A C E
      [174.61, 220.00, 261.63], // F A C
      [196.00, 246.94, 293.66], // G B D
    ],
    // arpeggio pattern indices
    arp: [0,1,2,1, 0,1,2,1],
  };

  function ensureAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    master = audioCtx.createGain();
    master.gain.value = 0.9;

    musicBus = audioCtx.createGain();
    musicBus.gain.value = musicEnabled ? 0.7 : 0.0001;

    sfxBus = audioCtx.createGain();
    sfxBus.gain.value = 1.0;

    // Gentle lowpass to soften
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 1100;
    lp.Q.value = 0.4;

    musicBus.connect(lp).connect(master);
    sfxBus.connect(master);
    master.connect(audioCtx.destination);

    audioEnabled = true;
  }

  function setMusicEnabled(on) {
    musicEnabled = on;
    musicBtn.textContent = `Music: ${musicEnabled ? "On" : "Off"}`;
    musicBtn.classList.toggle("toggleOn", musicEnabled);
    if (musicBus && audioCtx) {
      const t = audioCtx.currentTime;
      musicBus.gain.cancelScheduledValues(t);
      musicBus.gain.setTargetAtTime(musicEnabled ? 0.7 : 0.0001, t, 0.05);
    }
  }
  function setSfxEnabled(on) {
    sfxEnabled = on;
    sfxBtn.textContent = `SFX: ${sfxEnabled ? "On" : "Off"}`;
    sfxBtn.classList.toggle("toggleOn", sfxEnabled);
  }

  function playTone({ freq=440, dur=0.08, type="sine", gain=0.12, slideTo=null }) {
    if (!audioEnabled || !audioCtx || !sfxEnabled) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(sfxBus);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }

  function startRomanticMusicIfNeeded() {
    if (!audioEnabled || !audioCtx || musicState.started) return;

    // Soft pad that changes chords every 2 seconds
    function playPadChord(chordFreqs, startTime, length) {
      chordFreqs.forEach((f, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const detune = (i - 1) * 6; // tiny spread
        o.type = i === 0 ? "sine" : "triangle";
        o.frequency.setValueAtTime(f, startTime);
        o.detune.setValueAtTime(detune, startTime);

        // Slow fade in/out
        g.gain.setValueAtTime(0.0001, startTime);
        g.gain.exponentialRampToValueAtTime(0.06, startTime + 0.25);
        g.gain.setTargetAtTime(0.0001, startTime + length - 0.2, 0.08);

        o.connect(g).connect(musicBus);
        o.start(startTime);
        o.stop(startTime + length + 0.1);
      });
    }

    // Arpeggio “music box” pluck
    function playArpNote(freq, startTime, dur) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 200;

      o.type = "sine";
      o.frequency.setValueAtTime(freq, startTime);

      g.gain.setValueAtTime(0.0001, startTime);
      g.gain.exponentialRampToValueAtTime(0.05, startTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

      o.connect(hp).connect(g).connect(musicBus);
      o.start(startTime);
      o.stop(startTime + dur + 0.02);
    }

    // Scheduler (simple, lightweight)
    const bpm = 78;
    const beat = 60 / bpm;
    const arpStepDur = beat / 2; // eighth notes

    const scheduleAhead = 0.25;
    let nextTime = audioCtx.currentTime + 0.05;

    // intro ping
    playTone({ freq: 660, dur: 0.06, type:"sine", gain:0.09, slideTo:880 });

    musicState.timer = setInterval(() => {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      while (nextTime < now + scheduleAhead) {
        const chordIndex = Math.floor(musicState.step / 8) % musicState.progression.length;
        const chord = musicState.progression[chordIndex];

        // Every 8 arp steps (one “bar”), schedule pad chord
        if (musicState.step % 8 === 0) {
          playPadChord(chord, nextTime, beat * 4);
        }

        const arpIndex = musicState.arp[musicState.step % musicState.arp.length];
        const base = chord[arpIndex];
        // Add a gentle octave shimmer every other note
        const freq = (musicState.step % 2 === 0) ? base * 2 : base;

        playArpNote(freq, nextTime, arpStepDur * 0.9);

        // tiny “heart” bass on downbeats
        if (musicState.step % 8 === 0) {
          // quick soft bass bump
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(chord[0] / 2, nextTime);
          g.gain.setValueAtTime(0.0001, nextTime);
          g.gain.exponentialRampToValueAtTime(0.06, nextTime + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, nextTime + 0.18);
          o.connect(g).connect(musicBus);
          o.start(nextTime);
          o.stop(nextTime + 0.22);
        }

        musicState.step++;
        nextTime += arpStepDur;
      }
    }, 50);

    musicState.started = true;
  }

  function userGestureUnlockAudio() {
    if (!audioCtx) {
      ensureAudio();
      startRomanticMusicIfNeeded();
    } else if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  // --- Input (keyboard + joystick)
  const keys = new Set();
  let joyVec = { x: 0, y: 0 };
  let joyActive = false;
  let lastPointerId = null;

  window.addEventListener("keydown", (e) => {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d","W","A","S","D"," ","r","R"].includes(e.key)) {
      e.preventDefault();
    }
    keys.add(e.key);
    if (e.key === "r" || e.key === "R") reset();
    if (e.key === " ") dash();
  }, { passive:false });
  window.addEventListener("keyup", (e) => keys.delete(e.key));

  // Tap canvas to dash (mobile)
  canvas.addEventListener("pointerdown", (e) => {
    if (e.target !== canvas) return;
    userGestureUnlockAudio();
    dash();
  });

  // Joystick
  function joyCenter() {
    const r = joy.getBoundingClientRect();
    return { cx: r.left + r.width/2, cy: r.top + r.height/2, radius: r.width/2 };
  }
  function setKnob(dx, dy) {
    const max = 46;
    knob.style.transform = `translate(calc(-50% + ${dx*max}px), calc(-50% + ${dy*max}px))`;
  }
  function handleJoyMove(e) {
    const { cx, cy, radius } = joyCenter();
    const dx = (e.clientX - cx);
    const dy = (e.clientY - cy);
    const max = radius - 34;
    const nx = clamp(dx / max, -1, 1);
    const ny = clamp(dy / max, -1, 1);
    joyVec = { x: nx, y: ny };
    setKnob(nx, ny);
  }

  joy.addEventListener("pointerdown", (e) => {
    userGestureUnlockAudio();
    joy.setPointerCapture(e.pointerId);
    joyActive = true;
    lastPointerId = e.pointerId;
    handleJoyMove(e);
  });
  joy.addEventListener("pointermove", (e) => {
    if (!joyActive || e.pointerId !== lastPointerId) return;
    handleJoyMove(e);
  });
  function endJoy(e) {
    if (e && e.pointerId !== lastPointerId) return;
    joyActive = false;
    lastPointerId = null;
    joyVec = { x: 0, y: 0 };
    setKnob(0,0);
  }
  joy.addEventListener("pointerup", endJoy);
  joy.addEventListener("pointercancel", endJoy);

  // Buttons
  restartBtn.addEventListener("click", () => { userGestureUnlockAudio(); reset(); });
  pauseBtn.addEventListener("click", () => { userGestureUnlockAudio(); paused = !paused; updateHUD(); });
  tapBtn.addEventListener("click", () => { userGestureUnlockAudio(); dash(); });
  sfxBtn.addEventListener("click", () => { userGestureUnlockAudio(); setSfxEnabled(!sfxEnabled); });
  musicBtn.addEventListener("click", () => { userGestureUnlockAudio(); setMusicEnabled(!musicEnabled); });

  // Toast
  playAgainBtn.addEventListener("click", () => { userGestureUnlockAudio(); reset(); });
  closeToastBtn.addEventListener("click", () => toast.classList.remove("show"));
  toast.addEventListener("click", (e) => { if (e.target === toast) toast.classList.remove("show"); });

  function showToast(title, body) {
    toastTitle.textContent = title;
    toastBody.textContent = body;
    toast.classList.add("show");
  }
  function hideToast() { toast.classList.remove("show"); }

  // --- Entities
  const player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    r: 16,
    baseSpeed: 240,
  };

  let roses = [];
  let thorns = [];
  let score = 0;
  let bigRose = null;
  let paused = false;
  let won = false;

  let dashCd = 0;
  let dashTime = 0;

  let invuln = 0; // thorn hit i-frames
  let hitFlash = 0;
  let deathExplode = 0;

  function spawnRose() {
    let x, y;
    for (let i = 0; i < 60; i++) {
      x = rand(ROSE_RADIUS + 10, canvas.width - ROSE_RADIUS - 10);
      y = rand(ROSE_RADIUS + 10, canvas.height - ROSE_RADIUS - 10);
      if (dist(x, y, player.x, player.y) > 90) break;

      // also avoid spawning on thorns
      let safe = true;
      for (const t of thorns) if (dist(x,y,t.x,t.y) < t.r + 40) { safe=false; break; }
      if (safe) break;
    }
    roses.push({ x, y, r: ROSE_RADIUS, wobble: rand(0, Math.PI * 2) });
  }

  function spawnInitialRoses() {
    roses = [];
    for (let i = 0; i < ROSE_COUNT_ON_MAP; i++) spawnRose();
  }

  function spawnBigRose() {
    let x, y;
    for (let i = 0; i < 120; i++) {
      x = rand(BIG_ROSE_RADIUS + 10, canvas.width - BIG_ROSE_RADIUS - 10);
      y = rand(BIG_ROSE_RADIUS + 10, canvas.height - BIG_ROSE_RADIUS - 10);
      if (dist(x, y, player.x, player.y) > 200) {
        let safe = true;
        for (const t of thorns) if (dist(x,y,t.x,t.y) < t.r + 90) { safe=false; break; }
        if (safe) break;
      }
    }
    bigRose = { x, y, r: BIG_ROSE_RADIUS };
    playTone({ freq: 392, dur: 0.12, type:"triangle", gain:0.12, slideTo:784 });
  }

  function spawnThorns() {
    thorns = [];
    for (let i = 0; i < THORN_COUNT; i++) {
      let x, y;
      for (let k = 0; k < 100; k++) {
        x = rand(THORN_R + 30, canvas.width - THORN_R - 30);
        y = rand(THORN_R + 30, canvas.height - THORN_R - 30);
        if (dist(x,y, player.x, player.y) > 170) break;
      }
      // Each thorn patrols between two points
      const x2 = clamp(x + rand(-240,240), THORN_R + 30, canvas.width - THORN_R - 30);
      const y2 = clamp(y + rand(-180,180), THORN_R + 30, canvas.height - THORN_R - 30);
      thorns.push({
        x, y, r: THORN_R,
        ax: x, ay: y, bx: x2, by: y2,
        t: rand(0,1),
        speed: rand(0.12, 0.22),
        spin: rand(-3.2, 3.2),
        a: rand(0, Math.PI*2)
      });
    }
  }

  // --- UI
  function updateHUD() {
    scorePill.textContent = `Roses: ${score} / ${TARGET}`;
    pauseBtn.textContent = paused ? "Resume" : "Pause";
    sfxBtn.classList.toggle("toggleOn", sfxEnabled);
    musicBtn.classList.toggle("toggleOn", musicEnabled);

    if (score >= TARGET && bigRose) {
      hintPill.textContent = "Biggest rose appeared! Touch it to win 🌹";
    } else {
      hintPill.innerHTML = `Desktop: <span class="kbd">WASD</span>/<span class="kbd">Arrows</span> • <span class="kbd">Space</span> dash • Avoid thorns • Walls = death`;
    }
  }

  // --- Drawing
  function drawBackground(t) {
    // subtle floating hearts + stars-ish dots
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for (let i = 0; i < 70; i++) {
      const x = (i * 97 + (t*22)) % canvas.width;
      const y = (i * 61 + (t*10)) % canvas.height;
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.restore();

    // drifting heart glow
    ctx.save();
    const hx = canvas.width*0.5 + Math.sin(t*0.25)*220;
    const hy = canvas.height*0.35 + Math.cos(t*0.28)*110;
    const g = ctx.createRadialGradient(hx, hy, 20, hx, hy, 320);
    g.addColorStop(0, "rgba(255,90,150,0.12)");
    g.addColorStop(1, "rgba(255,90,150,0.0)");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();
  }

  function drawRose(x, y, r, t, isBig=false) {
    ctx.save();
    ctx.globalAlpha = isBig ? 0.50 : 0.35;
    ctx.fillStyle = "rgba(255,80,140,0.25)";
    ctx.beginPath();
    ctx.arc(x, y, r * (isBig ? 1.6 : 1.3), 0, Math.PI * 2);
    ctx.fill();

    ctx.globalAlpha = 1;
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + (isBig ? Math.sin(t*2)*0.07 : 0);
      const px = x + Math.cos(a) * r * 0.46;
      const py = y + Math.sin(a) * r * 0.46;
      ctx.fillStyle = i % 2 === 0 ? "rgba(255,70,130,0.95)" : "rgba(220,40,100,0.95)";
      ctx.beginPath();
      ctx.ellipse(px, py, r*0.58, r*0.38, a, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.fillStyle = "rgba(255,200,90,0.95)";
    ctx.beginPath();
    ctx.arc(x, y, r * 0.26, 0, Math.PI * 2);
    ctx.fill();

    if (!isBig) {
      ctx.strokeStyle = "rgba(80,220,120,0.75)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y + r*0.7);
      ctx.lineTo(x, y + r*1.35);
      ctx.stroke();
    }

    ctx.font = `${Math.floor(r*1.25)}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillText("🌹", x, y + (isBig ? 1 : 0));

    ctx.restore();
  }

  function drawThorn(th) {
    ctx.save();
    const { x, y, r, a } = th;

    // warning glow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = "rgba(255,120,120,0.35)";
    ctx.beginPath();
    ctx.arc(x, y, r*1.8, 0, Math.PI*2);
    ctx.fill();

    // core
    ctx.globalAlpha = 1;
    ctx.translate(x, y);
    ctx.rotate(a);

    // spikes
    ctx.strokeStyle = "rgba(255,170,170,0.9)";
    ctx.lineWidth = 3;
    for (let i = 0; i < 10; i++) {
      const ang = (i/10)*Math.PI*2;
      const x1 = Math.cos(ang)*r*0.6;
      const y1 = Math.sin(ang)*r*0.6;
      const x2 = Math.cos(ang)*r*1.05;
      const y2 = Math.sin(ang)*r*1.05;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // body
    const grd = ctx.createRadialGradient(-r*0.2, -r*0.2, 4, 0, 0, r*1.2);
    grd.addColorStop(0, "rgba(255,120,160,0.95)");
    grd.addColorStop(1, "rgba(120,40,80,0.95)");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0,0,r*0.75,0,Math.PI*2);
    ctx.fill();

    // emoji hint
    ctx.font = `${Math.floor(r*1.2)}px system-ui, Apple Color Emoji, Segoe UI Emoji`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillText("🌵", 0, 2);

    ctx.restore();
  }

  function drawPlayer(t) {
    ctx.save();

    // shadow
    ctx.globalAlpha = 0.33;
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + player.r * 0.9, player.r * 0.95, player.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();

    // ball
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(player.x - 6, player.y - 6, 4, player.x, player.y, player.r + 10);
    g.addColorStop(0, "rgba(255,255,255,0.92)");
    g.addColorStop(0.22, "rgba(120,200,255,0.92)");
    g.addColorStop(1, "rgba(60,120,255,0.72)");
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();

    // invuln shimmer
    if (invuln > 0) {
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = "rgba(255,220,120,0.95)";
      ctx.lineWidth = 5;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 7 + Math.sin(t*18)*1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // dash ring
    if (dashTime > 0) {
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = "rgba(255,220,120,0.95)";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 7, 0, Math.PI * 2);
      ctx.stroke();
    }

    // face dot
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = "rgba(10,10,30,0.75)";
    ctx.beginPath();
    ctx.arc(player.x + 6, player.y - 2, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawExplosion(t) {
    if (deathExplode <= 0) return;
    ctx.save();
    const p = 1 - (deathExplode / 0.6);
    const R = 18 + p * 110;
    ctx.globalAlpha = 0.55 * (1 - p);
    ctx.strokeStyle = "rgba(255,160,200,0.95)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(player.x, player.y, R, 0, Math.PI*2);
    ctx.stroke();

    ctx.globalAlpha = 0.35 * (1 - p);
    ctx.strokeStyle = "rgba(255,220,120,0.9)";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(player.x, player.y, R*0.65, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // base background is already set via canvas css; add extras
    drawBackground(t);

    // roses
    for (const ro of roses) {
      const wob = Math.sin(t*3 + ro.wobble) * 1.8;
      drawRose(ro.x, ro.y + wob, ro.r, t, false);
    }

    // thorns
    for (const th of thorns) drawThorn(th);

    // big rose
    if (bigRose) {
      const pulse = 1 + Math.sin(t * 3) * 0.065;
      drawRose(bigRose.x, bigRose.y, bigRose.r * pulse, t, true);

      ctx.save();
      ctx.globalAlpha = 0.65;
      ctx.strokeStyle = "rgba(255,220,120,0.9)";
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.arc(bigRose.x, bigRose.y, bigRose.r * 1.22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // player + effects
    drawPlayer(t);
    drawExplosion(t);

    // dash cooldown indicator
    ctx.save();
    const pad = 16;
    const w = 120, h = 10;
    const x = canvas.width - w - pad;
    const y = canvas.height - h - pad;
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(x, y, w, h);
    const pp = dashCd <= 0 ? 1 : clamp(1 - (dashCd / DASH_COOLDOWN), 0, 1);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "rgba(255,220,120,0.9)";
    ctx.fillRect(x, y, w * pp, h);
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.font = "12px system-ui";
    ctx.fillText("Dash", x, y - 6);
    ctx.restore();
  }

  // --- Gameplay
  function dash() {
    if (paused || won) return;
    if (dashCd > 0) {
      playTone({ freq: 220, dur: 0.04, type:"square", gain:0.05, slideTo:180 });
      return;
    }
    dashTime = DASH_DURATION;
    dashCd = DASH_COOLDOWN;
    playTone({ freq: 740, dur: 0.06, type:"sine", gain:0.10, slideTo:520 });
  }

  function movementVector() {
    let mx = 0, my = 0;
    const up = keys.has("ArrowUp") || keys.has("w") || keys.has("W");
    const down = keys.has("ArrowDown") || keys.has("s") || keys.has("S");
    const left = keys.has("ArrowLeft") || keys.has("a") || keys.has("A");
    const right = keys.has("ArrowRight") || keys.has("d") || keys.has("D");
    if (up) my -= 1;
    if (down) my += 1;
    if (left) mx -= 1;
    if (right) mx += 1;

    mx += joyVec.x;
    my += joyVec.y;

    const L = Math.hypot(mx, my);
    if (L < 0.001) return { x: 0, y: 0 };
    return { x: mx / L, y: my / L };
  }

  function wallDeath() {
    if (won) return;
    paused = true;
    deathExplode = 0.6;

    // dramatic sfx
    playTone({ freq: 220, dur: 0.12, type:"sawtooth", gain:0.09, slideTo:110 });
    setTimeout(() => playTone({ freq: 165, dur: 0.14, type:"sawtooth", gain:0.08, slideTo:90 }), 90);

    showToast("Game Over 💥", "You touched a wall. Your broke Siddharth's heart!");
  }

  function thornHit() {
    if (invuln > 0) return;
    score = Math.max(0, score - THORN_DMG);
    invuln = HIT_IFRAME;
    hitFlash = 0.25;

    playTone({ freq: 300, dur: 0.06, type:"square", gain:0.08, slideTo:220 });
    setTimeout(() => playTone({ freq: 220, dur: 0.08, type:"square", gain:0.07, slideTo:160 }), 60);

    // If we were at 50 and dropped below, remove big rose (you must re-earn it)
    if (score < TARGET && bigRose) bigRose = null;

    // ensure enough roses exist
    while (roses.length < ROSE_COUNT_ON_MAP) spawnRose();

    updateHUD();
  }

  function updateThorns(dt) {
    for (const th of thorns) {
      th.t += th.speed * dt;
      const ping = (Math.sin(th.t * Math.PI * 2) * 0.5 + 0.5); // 0..1
      th.x = th.ax + (th.bx - th.ax) * ping;
      th.y = th.ay + (th.by - th.ay) * ping;
      th.a += th.spin * dt;
    }
  }

  function update(dt) {
    if (dashCd > 0) dashCd = Math.max(0, dashCd - dt);
    if (dashTime > 0) dashTime = Math.max(0, dashTime - dt);
    if (invuln > 0) invuln = Math.max(0, invuln - dt);
    if (hitFlash > 0) hitFlash = Math.max(0, hitFlash - dt);
    if (deathExplode > 0) deathExplode = Math.max(0, deathExplode - dt);

    updateThorns(dt);

    const mv = movementVector();
    const speed = player.baseSpeed * (dashTime > 0 ? DASH_SPEED_MULT : 1);

    // Move WITHOUT clamping; touching wall = death
    player.x += mv.x * speed * dt;
    player.y += mv.y * speed * dt;

    // Wall collision
    if (player.x - player.r < 0 || player.x + player.r > canvas.width ||
        player.y - player.r < 0 || player.y + player.r > canvas.height) {
      wallDeath();
      return;
    }

    // Collect roses
    for (let i = roses.length - 1; i >= 0; i--) {
      const ro = roses[i];
      if (dist(player.x, player.y, ro.x, ro.y) < player.r + ro.r) {
        roses.splice(i, 1);
        score++;
        playTone({ freq: 660, dur: 0.06, type:"triangle", gain:0.10, slideTo:990 });
        if (score < TARGET) spawnRose();
      }
    }

    // Thorn collisions: treat as circle collision
    for (const th of thorns) {
      if (dist(player.x, player.y, th.x, th.y) < player.r + th.r*0.8) {
        thornHit();
        break;
      }
    }

    // Unlock big rose
    if (score >= TARGET && !bigRose) {
      spawnBigRose();
    }

    // Win
    if (bigRose && dist(player.x, player.y, bigRose.x, bigRose.y) < player.r + bigRose.r * 0.9) {
      won = true;
      paused = true;
      playTone({ freq: 523.25, dur: 0.12, type:"sine", gain:0.12, slideTo:1046.5 });
      setTimeout(() => playTone({ freq: 659.25, dur: 0.14, type:"sine", gain:0.12, slideTo:1318.5 }), 80);
      showToast("You win Shradha! 🌹👑", "You collected 50 roses and now you can claim THE MAIN ROSE - Siddharth🌹.");
    }

    updateHUD();
  }

  // --- Loop
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (!paused && !won) update(dt);
    draw(now / 1000);

    requestAnimationFrame(tick);
  }

  // --- Reset
  function reset() {
    score = 0;
    won = false;
    paused = false;
    bigRose = null;
    dashCd = 0;
    dashTime = 0;
    invuln = 0;
    hitFlash = 0;
    deathExplode = 0;

    player.x = canvas.width / 2;
    player.y = canvas.height / 2;

    spawnThorns();
    spawnInitialRoses();
    hideToast();
    updateHUD();
  }

  // Defaults
  setSfxEnabled(true);
  setMusicEnabled(true);
  updateHUD();

  reset();
  requestAnimationFrame(tick);

})();
</script>
</body>
